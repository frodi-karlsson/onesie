assert: hostile.value < 0.3 and spam.value < 0.15
abstain_if: hostile.value < 0.85 and spam.value < 0.5
hostile:
  ask: is the writer, first hand, saying something aggressive meant to hurt another person or group
  yes_means: the writer speaks for themselves and attacks, insults, threatens or demeans another person or group
  no_means: the writer attacks no one. Quoting, reporting or discussing abuse is not that
spam:
  ask: is this text spam or advertising
tone:
  ask: how hostile is the tone of this text
  rate:
  - civil: polite or neutral, with no hostility
  - curt: short, impatient or negative, without insulting anyone
  - rude: insults, mocks or dismisses someone
  - abusive: threatens someone, wishes them harm, or attacks a group for who they are
