# yaml-language-server: $schema=https://raw.githubusercontent.com/frodi-karlsson/onesie/main/schema/questions.json
assert: name_contact.value < 0.15 and email_phone.value < 0.4 and home_address.value < 0.45 and credential.value < 0.2
abstain_if: name_contact.value < 0.5 and email_phone.value < 0.7 and home_address.value < 0.94 and credential.value < 0.38
name_contact:
  ask: does this text give a person's name together with a way to contact them
email_phone:
  ask: does this text contain an email address or phone number that belongs to a person
  no_means: every address and number in it is shared by a team or role, such as support@ or hr@, even when a named person is meant to read it
home_address:
  ask: does this text contain a home address
credential:
  ask: does this text contain a password, access token or API key
  yes_means: it holds a secret value someone could use to sign in, such as a password, a token, an API key or a private key block
  no_means: it holds no usable secret. A placeholder such as sk-..., the name of a variable that holds a key, a public key and where a password is kept are not one
