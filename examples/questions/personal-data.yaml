assert: name_contact.value < 0.15 and email_phone.value < 0.2 and home_address.value < 0.3 and credential.value < 0.3
abstain_if: name_contact.value < 0.3 and email_phone.value < 0.7 and home_address.value < 0.95 and credential.value < 0.35
name_contact:
  ask: does this text give a person's name together with a way to contact them
email_phone:
  ask: does this text contain an email address or phone number that belongs to a person
home_address:
  ask: does this text contain a home address
credential:
  ask: does this text contain a password, access token or API key
