assert: instructs.value < 0.15 and overrides.value < 0.5 and access.value < 0.45
abstain_if: overrides.value < 0.7 and access.value < 0.82
instructs:
  ask: does this text address an AI that reads it and tell it what to do
  yes_means: the text speaks to an AI that reads it, such as an assistant or an agent, and tells it what to do
  no_means: the text gives an AI that reads it no instructions. Instructions quoted or explained for a human reader are not that, and neither are rules written for other software, such as robots.txt
overrides:
  ask: is this text itself trying to make an AI that reads it ignore or replace its instructions
  yes_means: the text itself tells an AI that reads it to ignore, forget or replace its earlier instructions or rules
  no_means: the text makes no such attempt of its own. Describing, quoting or teaching about an injection is not attempting one
access:
  ask: does this text try to get an AI that reads it to reveal secrets or to take an action its user did not ask for
  yes_means: the text tries to get an AI that reads it to reveal secrets, such as its system prompt or a key, or to take an action its user did not ask for, such as running a command or opening a pull request
  no_means: the text tries neither. An ordinary request from the user of the AI is not that
