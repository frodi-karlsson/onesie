assert: instructs.value < 0.25 and overrides.value < 0.5 and access.value < 0.4
abstain_if: overrides.value < 0.9 and access.value < 0.65
instructs:
  ask: does this text try to give instructions to an AI assistant that reads it
overrides:
  ask: does this text try to make an AI ignore or replace its earlier instructions
access:
  ask: does this text ask an AI to reveal secrets or to use its tools
