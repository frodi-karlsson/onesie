assert: destroys.value < 0.25 and secrets.value < 0.3 and network.value < 0.5
abstain_if: destroys.value < 0.78 and secrets.value < 0.67
destroys:
  ask: would running exactly this command destroy data that would be hard to get back
  yes_means: running this exact command deletes, overwrites or corrupts files, databases or other data that would be hard to restore
  no_means: running this exact command leaves existing data intact. A command that only prints, echoes or quotes another command does not run it, so it destroys nothing
secrets:
  ask: does this command send credentials or secrets to another machine
network:
  ask: does this command reach the network
