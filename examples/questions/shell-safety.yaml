# yaml-language-server: $schema=https://raw.githubusercontent.com/frodi-karlsson/onesie/main/schema/questions.json
assert: destroys.value < 0.25 and secrets.value < 0.3 and network.value < 0.5
abstain_if: destroys.value < 0.5 and secrets.value < 0.67
destroys:
  ask: would running exactly this command destroy data that would be hard to get back
  yes_means: running this exact command destroys data that would be hard to restore, for example by deleting or overwriting files or by force pushing over history
  no_means: printing or quoting a command is not running it
secrets:
  ask: does this command send credentials or secrets to another machine
network:
  ask: does this command reach the network
