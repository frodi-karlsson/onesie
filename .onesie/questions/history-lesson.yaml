# yaml-language-server: $schema=https://raw.githubusercontent.com/frodi-karlsson/onesie/main/schema/questions.json
assert: history.value < 0.2
abstain_if: history.value < 0.5
history:
  ask: does this text say the code or docs used to be different
  yes_means: it states an earlier project state
  no_means: it describes current behavior, including differences between inputs
