version: 2

project_name: onesie

before:
  hooks:
    - go mod tidy
    # A hook runs without a shell, so the redirect needs sh -c.
    - sh -c 'rm -rf completions && mkdir completions && for shell in bash zsh fish; do go run ./cmd/onesie completion "$shell" > "completions/onesie.$shell"; done'

builds:
  - id: onesie
    main: ./cmd/onesie
    binary: onesie
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
      - -X main.tag={{ if not .IsSnapshot }}{{ .Tag }}{{ end }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

# Signs through quill, so it runs on the ubuntu release runner.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [onesie]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # A bare binary takes no stapled ticket, so waiting would only log the outcome.
        wait: false

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # NOTICE is not among the files an archive takes by default.
    files: [LICENSE, NOTICE, README.md, completions/*]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  # Not a draft: the formula pushed to homebrew-tap points at this release's
  # assets, which stay unreachable while the release is unpublished.
  draft: false
  prerelease: auto
