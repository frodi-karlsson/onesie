name: Release

on:
  push:
    tags:
      - 'v*'

# Third party code is pinned by digest rather than by tag, so a retagged
# release cannot silently change what runs here. Trailing comments record the
# human readable version each digest corresponds to.
jobs:
  # A tag is published only from a tree that passes the same check CI runs.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download Go dependencies
        run: go mod download

      - name: Install golangci-lint
        env:
          GOLANGCI_VERSION: v2.13.2
          # sha256 of install.sh at the tag above. It is verified before the
          # script runs. The script in turn verifies the release tarball
          # against golangci-lint's own published checksums.
          INSTALL_SH_SHA256: 1022ddb4d87ed252350ed03fc9677e250a4ae95cc6bcd4658c2a20a8a23d390f
        run: |
          set -euo pipefail
          curl -sSfL -o install-golangci-lint.sh \
            "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_VERSION}/install.sh"
          echo "${INSTALL_SH_SHA256}  install-golangci-lint.sh" | sha256sum -c -
          sh install-golangci-lint.sh -b "$(go env GOPATH)/bin" "${GOLANGCI_VERSION}"
          rm install-golangci-lint.sh

      - name: Run check
        run: make check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub release for this repo. Pushing the formula to
      # homebrew-tap is a cross repo write, so it uses HOMEBREW_TAP_TOKEN.
      contents: write
      # The provenance attestation: id-token mints the OIDC token Sigstore
      # signs against, and attestations stores the result on this repo.
      id-token: write
      attestations: write
    env:
      # 'false' keeps the generated formula out of homebrew-tap.
      # HOMEBREW_TAP_TOKEN has write access to homebrew-tap.
      HOMEBREW_TAP_PUBLISH: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog

      # The plugins install the skills from the tag they name, so each release
      # has to name itself before it is tagged.
      - name: Check the plugin manifests name this tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          test "$(jq -r .version .claude-plugin/plugin.json)" = "${tag#v}"
          test "$(jq -r .version .codex-plugin/plugin.json)" = "${tag#v}"
          test "$(jq -r '.plugins[0].source.ref' .claude-plugin/marketplace.json)" = "$tag"
          test "$(jq -r '.plugins[0].source.ref' .agents/plugins/marketplace.json)" = "$tag"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # The exact GoReleaser release, so a new one cannot change what
          # a tag publishes.
          version: 'v2.18.2'
          args: release --clean
        env:
          # Publishes the release in this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing and notarizing the darwin binaries. An unset secret
          # arrives empty, and isEnvSet treats an empty variable as unset, so
          # the notarize block in .goreleaser.yml stays off until
          # MACOS_SIGN_P12 exists.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # gh attestation verify checks a downloaded archive against this.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # goreleaser's brews is deprecated and its casks get quarantined, which
      # Gatekeeper refuses for an unsigned binary. So the formula comes from
      # this repo's own generator, fed the checksums goreleaser published.
      - name: Generate Homebrew formula
        run: |
          go run ./cmd/formulagen -version "${GITHUB_REF_NAME}" \
            -checksums dist/checksums.txt -out dist/homebrew/Formula/onesie.rb
          cat dist/homebrew/Formula/onesie.rb

      # A prerelease tag never reaches the tap.
      - name: Check out homebrew-tap
        if: env.HOMEBREW_TAP_PUBLISH == 'true' && !contains(github.ref_name, '-')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frodi-karlsson/homebrew-tap
          # Pushing to another repo needs more than the workflow's GITHUB_TOKEN.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Push Homebrew formula
        if: env.HOMEBREW_TAP_PUBLISH == 'true' && !contains(github.ref_name, '-')
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          # The tap keeps its formulae at the root. A Formula directory would
          # make Homebrew stop reading the ones already there.
          cp ../dist/homebrew/Formula/onesie.rb onesie.rb
          git add onesie.rb
          if git diff --cached --quiet; then
            echo "onesie.rb is already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "onesie ${GITHUB_REF_NAME}"
          git push
