name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third party code is pinned by digest rather than by tag, so a retagged
# release cannot silently change what runs here. Trailing comments record the
# human readable version each digest corresponds to.
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download Go dependencies
        run: go mod download

      - name: Install golangci-lint
        env:
          GOLANGCI_VERSION: v2.13.2
          # sha256 of install.sh at the tag above. It is verified before the
          # script runs. The script in turn verifies the release tarball
          # against golangci-lint's own published checksums.
          INSTALL_SH_SHA256: 1022ddb4d87ed252350ed03fc9677e250a4ae95cc6bcd4658c2a20a8a23d390f
        run: |
          set -euo pipefail
          curl -sSfL -o install-golangci-lint.sh \
            "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_VERSION}/install.sh"
          echo "${INSTALL_SH_SHA256}  install-golangci-lint.sh" | sha256sum -c -
          sh install-golangci-lint.sh -b "$(go env GOPATH)/bin" "${GOLANGCI_VERSION}"
          rm install-golangci-lint.sh

      - name: Run check
        run: make check

      - name: Check the skills are current
        run: |
          make skills
          git status --porcelain
          test -z "$(git status --porcelain)"

      # skills-check builds the binary itself and puts bin/ on PATH.
      - name: Check the skill examples
        run: make skills-check

  # The check job already covers linux on amd64. This covers every other
  # platform the release ships a binary for.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, macos-15-intel, ubuntu-24.04-arm, windows-11-arm]
        include:
          - race: -race
          # The race detector does not support windows on arm64.
          - os: windows-11-arm
            race: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go tool gotestsum --format testname -- ${{ matrix.race }} -timeout 2m ./...

  # Every fuzz target for a short run, so a regression in a parser or an
  # escaper shows up on the commit that caused it. make fuzz fails when a
  # target is missing from its list.
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz
        run: make fuzz-check && make fuzz FUZZTIME=10s

  # install.sh against a snapshot built from this tree, served through file://.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser reads the tags to pick the snapshot version

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The ubuntu image ships shellcheck and the script is the same file on
      # both, so one run covers it.
      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh

      - name: Build a snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: 'v2.18.2'
          args: release --snapshot --clean --skip=publish

      # No GH_TOKEN is set, so gh is logged out and install.sh skips the
      # provenance check, which a snapshot has nothing to match.
      - name: Install from the snapshot
        env:
          ONESIE_RELEASE_BASE_URL: file://${{ github.workspace }}/dist
          ONESIE_INSTALL_DIR: ${{ runner.temp }}/onesie-bin
        run: |
          sh install.sh
          "$ONESIE_INSTALL_DIR/onesie" version

  tidy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Tidy
        run: go mod tidy

      - name: Fail if go.mod/go.sum are not tidy
        run: git diff --exit-code -- go.mod go.sum

  vuln:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Scan for known vulnerabilities
        run: go tool govulncheck ./...
